spring:
  application:
    name: civalpha-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/civalpha}
    username: ${DATABASE_USER:civalpha}
    password: ${DATABASE_PASSWORD:civalpha}
    hikari:
      maximum-pool-size: 8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

civalpha:
  universe-file: ${CIVALPHA_UNIVERSE_FILE:../config/universe.yml}
  storage:
    documents-dir: ${CIVALPHA_DOCUMENTS_DIR:../var/data/documents}
    imports-dir: ${CIVALPHA_IMPORTS_DIR:../var/data/imports}
  sec:
    # live: fetch from SEC EDGAR (requires a declared User-Agent with contact email); fixture: read local files
    mode: ${CIVALPHA_SEC_MODE:fixture}
    user-agent: ${SEC_USER_AGENT:}
    max-requests-per-second: ${SEC_MAX_RPS:5}
    fixture-dir: ${CIVALPHA_SEC_FIXTURE_DIR:../var/data/demo/sec}
    lookback-years: ${SEC_LOOKBACK_YEARS:6}
  ml:
    base-url: ${CIVALPHA_ML_URL:http://localhost:8000}
    timeout-seconds: 900
  demo:
    data-dir: ${CIVALPHA_DEMO_DIR:../var/data/demo}
    replay-months: 12
  fred:
    api-key: ${FRED_API_KEY:}
    base-url: https://api.stlouisfed.org/fred
    series: FEDFUNDS,CPIAUCSL
  events:
    federal-register-enabled: ${EVENTS_FEDERAL_REGISTER_ENABLED:false}
    fed-rss-enabled: ${EVENTS_FED_RSS_ENABLED:false}
    news-feeds: ${EVENTS_NEWS_FEEDS:}
  llm:
    provider: ${CIVALPHA_LLM_PROVIDER:none}
    model: ${CIVALPHA_LLM_MODEL:claude-opus-5-5}
    api-key: ${ANTHROPIC_API_KEY:}
  security:
    # When set, /api/admin/** and every non-GET /api request require this token (X-Admin-Token or Authorization: Bearer).
    admin-token: ${CIVALPHA_ADMIN_TOKEN:}
  schedule:
    # Spring cron (sec min hour day month weekday); "-" disables. Example: "0 30 22 * * MON-FRI" = after the US close.
    pipeline-cron: ${CIVALPHA_PIPELINE_CRON:-}
    outcomes-cron: ${CIVALPHA_OUTCOMES_CRON:-}
    zone: ${CIVALPHA_SCHEDULE_ZONE:America/New_York}

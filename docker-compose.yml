# CivAlpha local stack: PostgreSQL + Python API + Python worker + Angular UI (nginx).
# Usage: cp .env.example .env && docker compose up -d --build   -> http://localhost:8088
name: civalpha

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://civalpha:${POSTGRES_PASSWORD:-civalpha}@postgres:5432/civalpha
  CIVALPHA_DOCUMENTS_DIR: /data/documents
  CIVALPHA_IMPORTS_DIR: /data/imports
  SEC_USER_AGENT: ${SEC_USER_AGENT:-}
  SEC_MAX_RPS: ${SEC_MAX_RPS:-5}
  SEC_LOOKBACK_YEARS: ${SEC_LOOKBACK_YEARS:-6}
  FRED_API_KEY: ${FRED_API_KEY:-}
  EVENTS_FEDERAL_REGISTER_ENABLED: ${EVENTS_FEDERAL_REGISTER_ENABLED:-false}
  EVENTS_FED_RSS_ENABLED: ${EVENTS_FED_RSS_ENABLED:-false}
  EVENTS_NEWS_FEEDS: ${EVENTS_NEWS_FEEDS:-}
  CIVALPHA_LLM_PROVIDER: ${CIVALPHA_LLM_PROVIDER:-none}
  CIVALPHA_LLM_MODEL: ${CIVALPHA_LLM_MODEL:-claude-opus-5-5}
  CIVALPHA_LLM_REVIEW: ${CIVALPHA_LLM_REVIEW:-advisory}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  CIVALPHA_JEV_MODEL: ${CIVALPHA_JEV_MODEL:-jev-1.13.0}
  CIVALPHA_ADMIN_TOKEN: ${CIVALPHA_ADMIN_TOKEN:-}
  CIVALPHA_AUTH: ${CIVALPHA_AUTH:-token}
  CIVALPHA_COOKIE_SECURE: ${CIVALPHA_COOKIE_SECURE:-true}
  CIVALPHA_QUOTES_SECONDS: ${CIVALPHA_QUOTES_SECONDS:-300}
  CIVALPHA_PRICE_PROVIDER: ${CIVALPHA_PRICE_PROVIDER:-none}
  TIINGO_API_KEY: ${TIINGO_API_KEY:-}
  CIVALPHA_PRICE_HISTORY_START: ${CIVALPHA_PRICE_HISTORY_START:-2019-01-02}
  CIVALPHA_PIPELINE_CRON: ${CIVALPHA_PIPELINE_CRON:--}
  CIVALPHA_OUTCOMES_CRON: ${CIVALPHA_OUTCOMES_CRON:--}
  CIVALPHA_SCHEDULE_ZONE: ${CIVALPHA_SCHEDULE_ZONE:-America/New_York}
  CIVALPHA_MCP_ALLOWED_HOSTS: ${CIVALPHA_MCP_ALLOWED_HOSTS:-}
  CIVALPHA_MCP_ALLOWED_ORIGINS: ${CIVALPHA_MCP_ALLOWED_ORIGINS:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civalpha
      POSTGRES_USER: civalpha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civalpha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civalpha -d civalpha"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  # REST API; applies pending database migrations before it starts
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}   # docker compose build --build-arg GIT_COMMIT=$(git rev-parse HEAD) api
    image: civalpha-app:local
    environment: *app-env
    command: ["sh", "-c", "python -m civalpha.platform.migrate && exec uvicorn civalpha.platform.app:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"]
    volumes:
      - civdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: 768m
    restart: unless-stopped

  # background jobs (ingestion, model training, backtests) and the optional schedules
  worker:
    image: civalpha-app:local
    environment: *app-env
    command: ["python", "-m", "civalpha.platform.worker"]
    volumes:
      - civdata:/data
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 2g
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${CIVALPHA_BIND:-127.0.0.1}:${CIVALPHA_PORT:-8088}:80"   # localhost only by default: admin endpoints have no authentication
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

volumes:
  pgdata:
  civdata:   # original source documents (/data/documents), CSV drop folder (/data/imports), uploads (/data/uploads)
